<!doctype html>
<html lang="th" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/layout :: head('บริการ')}"></head>
  <body>
    <aside th:replace="~{fragments/layout :: sidebar('services')}"></aside>
    <div th:replace="~{fragments/layout :: overlay}"></div>
    <div class="app-shell">
      <header th:replace="~{fragments/layout :: topbar}"></header>
      <main class="app-content">
        <div th:replace="~{fragments/layout :: flash}"></div>
        <div class="page-header">
          <div>
            <h1 class="page-title">บริการ</h1>
            <p class="page-subtitle">กำหนดบริการ ราคา และระยะเวลามาตรฐาน</p>
          </div>
          <button
            class="btn btn-primary"
            data-bs-toggle="modal"
            data-bs-target="#serviceModal"
          >
            <i class="bi bi-plus-lg me-2"></i>เพิ่มบริการ
          </button>
        </div>
        <form class="card filter-bar">
          <div class="input-group">
            <span class="input-group-text bg-transparent"
              ><i class="bi bi-search"></i></span
            ><input
              class="form-control"
              name="q"
              th:value="${q}"
              placeholder="ค้นหารหัสหรือชื่อบริการ"
            /><button class="btn btn-outline-primary">ค้นหา</button>
          </div>
        </form>
        <section class="card">
          <div class="table-responsive">
            <table class="table table-hover">
              <thead>
                <tr>
                  <th>รหัสบริการ</th>
                  <th>ชื่อบริการ</th>
                  <th>รายละเอียด</th>
                  <th class="text-end">ราคามาตรฐาน</th>
                  <th>ระยะเวลา</th>
                  <th>สถานะ</th>
                  <th></th>
                </tr>
              </thead>
              <tbody>
                <tr th:each="s:${services.content}">
                  <td
                    class="text-primary fw-bold"
                    th:text="${s.serviceCode}"
                  ></td>
                  <td class="fw-semibold" th:text="${s.serviceName}"></td>
                  <td th:text="${s.description}"></td>
                  <td
                    class="text-end"
                    th:text="'฿'+${#numbers.formatDecimal(s.defaultPrice,1,'COMMA',2,'POINT')}"
                  ></td>
                  <td th:text="${s.defaultDurationMinutes}+' นาที'"></td>
                  <td>
                    <span
                      class="status-badge"
                      th:classappend="'status-'+${s.status}"
                      th:text="${statusLabels[s.status]}"
                    ></span>
                  </td>
                  <td>
                    <form
                      class="js-confirm"
                      th:action="@{/services/{id}/toggle(id=${s.id})}"
                      method="post"
                    >
                      <button
                        class="btn btn-sm btn-outline-secondary"
                        th:text="${s.active?'ปิด':'เปิด'}"
                      ></button>
                    </form>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </section>
      </main>
    </div>
    <div class="modal fade" id="serviceModal">
      <div class="modal-dialog">
        <form
          class="modal-content"
          th:action="@{/services}"
          th:object="${serviceForm}"
          method="post"
        >
          <div class="modal-header">
            <h5 class="modal-title">เพิ่มบริการ</h5>
            <button class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <label class="form-label required">ชื่อบริการ</label
            ><input
              class="form-control mb-3"
              th:field="*{serviceName}"
              required
            /><label class="form-label">รายละเอียด</label
            ><textarea
              class="form-control mb-3"
              th:field="*{description}"
            ></textarea>
            <div class="row g-2">
              <div class="col-6">
                <label class="form-label">ราคามาตรฐาน</label
                ><input
                  class="form-control"
                  type="number"
                  step="0.01"
                  th:field="*{defaultPrice}"
                />
              </div>
              <div class="col-6">
                <label class="form-label">ระยะเวลา (นาที)</label
                ><input
                  class="form-control"
                  type="number"
                  th:field="*{defaultDurationMinutes}"
                />
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button class="btn btn-primary">บันทึกบริการ</button>
          </div>
        </form>
      </div>
    </div>
    <div th:replace="~{fragments/layout :: scripts}"></div>
  </body>
</html>
