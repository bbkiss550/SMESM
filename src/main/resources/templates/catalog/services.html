<!doctype html>
<html lang="th" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/layout :: head('บริการ')}"></head>
  <body>
    <aside th:replace="~{fragments/layout :: sidebar('services')}"></aside>
    <div th:replace="~{fragments/layout :: overlay}"></div>
    <div class="app-shell">
      <header th:replace="~{fragments/layout :: topbar}"></header>
      <main class="app-content">
        <div th:replace="~{fragments/layout :: flash}"></div>
        <div class="page-header">
          <div>
            <h1 class="page-title">บริการ</h1>
            <p class="page-subtitle">กำหนดบริการ ราคา และระยะเวลามาตรฐาน</p>
          </div>
          <button
            class="btn btn-primary"
            data-bs-toggle="modal"
            data-bs-target="#serviceModal"
          >
            <i class="bi bi-plus-lg me-2"></i>เพิ่มบริการ
          </button>
        </div>
        <form class="card filter-bar" data-ajax-search="services">
          <div class="input-group">
            <span class="input-group-text bg-transparent"
              ><i class="bi bi-search"></i></span
            ><input
              class="form-control"
              name="q"
              th:value="${q}"
              placeholder="ค้นหารหัสหรือชื่อบริการ"
            /><button class="btn btn-outline-primary">ค้นหา</button>
          </div>
        </form>
        <section class="card" data-ajax-table="services">
          <div class="table-responsive">
            <table class="table table-hover">
              <thead>
                <tr>
                  <th>รหัสบริการ</th>
                  <th>ชื่อบริการ</th>
                  <th>รายละเอียด</th>
                  <th class="text-end">ราคามาตรฐาน</th>
                  <th>ระยะเวลา</th>
                  <th>สถานะ</th>
                  <th>จัดการ</th>
                </tr>
              </thead>
              <tbody>
                <tr th:each="s:${services.content}">
                  <td
                    class="text-primary fw-bold"
                    th:text="${s.serviceCode}"
                  ></td>
                  <td class="fw-semibold" th:text="${s.serviceName}"></td>
                  <td th:text="${s.description}"></td>
                  <td
                    class="text-end"
                    th:text="'฿'+${#numbers.formatDecimal(s.defaultPrice,1,'COMMA',2,'POINT')}"
                  ></td>
                  <td th:text="${s.defaultDurationMinutes}+' นาที'"></td>
                  <td>
                    <span
                      class="status-badge"
                      th:classappend="'status-'+${s.status}"
                      th:text="${statusLabels[s.status]}"
                    ></span>
                  </td>
                  <td>
                    <div class="d-flex flex-wrap gap-1">
                      <button type="button" class="btn btn-sm btn-outline-primary" data-bs-toggle="modal" data-bs-target="#serviceModal" data-edit-kind="service"
                        th:attr="data-id=${s.id},data-service-name=${s.serviceName},data-description=${s.description},data-default-price=${s.defaultPrice},data-default-duration-minutes=${s.defaultDurationMinutes}">
                        <i class="bi bi-pencil me-1"></i>แก้ไข
                      </button>
                      <form class="js-confirm" th:action="@{/services/{id}/toggle(id=${s.id})}" method="post" th:attr="data-confirm-title=${s.active?'ลบบริการนี้?':'เปิดใช้งานบริการนี้?'},data-confirm-text=${s.active?'ระบบจะปิดใช้งานและเก็บประวัติบริการไว้':'บริการจะกลับมาใช้งานได้'}">
                        <button class="btn btn-sm btn-outline-danger" th:text="${s.active?'ลบ':'เปิดใช้งาน'}"></button>
                      </form>
                    </div>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
          <div th:replace="~{fragments/layout :: pagination(page=${services}, baseUrl='/services', q=${q}, status=null)}"></div>
        </section>
      </main>
    </div>
    <div class="modal fade" id="serviceModal" data-reset-on-open data-create-action="/services" data-create-title="เพิ่มบริการ" data-create-submit="บันทึกบริการ">
      <div class="modal-dialog">
        <form
          class="modal-content"
          th:action="@{/services}"
          th:object="${serviceForm}"
          method="post"
        >
          <div class="modal-header">
            <h5 class="modal-title" data-form-title>เพิ่มบริการ</h5>
            <button class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <label class="form-label required">ชื่อบริการ</label
            ><input
              class="form-control mb-3"
              th:field="*{serviceName}"
              required
            /><label class="form-label">รายละเอียด</label
            ><textarea
              class="form-control mb-3"
              th:field="*{description}"
            ></textarea>
            <div class="row g-2">
              <div class="col-6">
                <label class="form-label">ราคามาตรฐาน</label
                ><input
                  class="form-control"
                  type="number"
                  step="0.01"
                  th:field="*{defaultPrice}"
                />
              </div>
              <div class="col-6">
                <label class="form-label">ระยะเวลา (นาที)</label
                ><input
                  class="form-control"
                  type="number"
                  th:field="*{defaultDurationMinutes}"
                />
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button class="btn btn-primary" data-form-submit>บันทึกบริการ</button>
          </div>
        </form>
      </div>
    </div>
    <div th:replace="~{fragments/layout :: scripts}"></div>
  </body>
</html>
