<!doctype html>
<html lang="th" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/layout :: head('เกิดข้อผิดพลาด')}"></head>
  <body class="public-body">
    <main class="min-vh-100 d-grid align-items-center">
      <div class="container text-center" style="max-width: 620px">
        <div class="display-1 fw-bold text-primary" th:text="${status ?: 500}">
          404
        </div>
        <h1 class="h3 fw-bold">ไม่สามารถดำเนินการได้</h1>
        <p
          class="text-muted fs-5"
          th:text="${message ?: 'เกิดข้อผิดพลาด กรุณาลองใหม่อีกครั้ง'}"
        ></p>
        <div class="d-flex justify-content-center gap-2">
          <button class="btn btn-outline-primary" onclick="history.back()">
            <i class="bi bi-arrow-left me-2"></i>ย้อนกลับ</button
          ><a class="btn btn-primary" th:href="@{/}"
            ><i class="bi bi-house me-2"></i>หน้าหลัก</a
          >
        </div>
      </div>
    </main>
    <div th:replace="~{fragments/layout :: scripts}"></div>
  </body>
</html>
