<!doctype html>
<html lang="th" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/layout :: head('งานบริการ')}"></head>
  <body>
    <aside th:replace="~{fragments/layout :: sidebar('jobs')}"></aside>
    <div th:replace="~{fragments/layout :: overlay}"></div>
    <div class="app-shell">
      <header th:replace="~{fragments/layout :: topbar}"></header>
      <main class="app-content">
        <div th:replace="~{fragments/layout :: flash}"></div>
        <div class="page-header">
          <div>
            <h1 class="page-title">งานบริการ</h1>
            <p class="page-subtitle">
              จัดการใบงานบริการ ดูแลลูกค้า และติดตามงานได้อย่างมีประสิทธิภาพ
            </p>
          </div>
          <button
            class="btn btn-primary px-4"
            type="button"
            data-bs-toggle="modal"
            data-bs-target="#createJobModal"
          ><i class="bi bi-plus-lg me-2"></i>สร้างใบงาน</button>
        </div>
        <section class="kpi-grid job-kpi-grid">
          <button type="button" class="card kpi-card text-start" data-job-status-filter=""
            th:attr="aria-pressed=${selectedStatus == null}">
            <div>
              <div class="kpi-label">ทั้งหมด</div>
              <div class="kpi-value" th:text="${totalJobs}">0</div>
            </div>
          </button>
          <button
            type="button" class="card kpi-card text-start"
            th:each="s:${statuses}"
            th:if="${s.name() != 'CANCELLED'}"
            th:attr="data-job-status-filter=${s.name()},aria-pressed=${s == selectedStatus}"
          >
            <div>
              <div class="kpi-label" th:text="${statusLabels[s.name()]}"></div>
              <div class="kpi-value" th:text="${jobStatusCounts[s.name()]}">0</div>
            </div>
          </button>
        </section>
        <form class="card filter-bar" method="get" data-ajax-search="jobs">
          <div class="row g-2 align-items-center">
            <div class="col-lg-7">
              <div class="input-group">
                <span class="input-group-text bg-transparent"
                  ><i class="bi bi-search"></i></span
                ><input
                  class="form-control"
                  name="q"
                  th:value="${q}"
                  placeholder="ค้นหาเลขที่ใบงาน ลูกค้า เบอร์โทร หรือหัวข้องาน"
                />
              </div>
            </div>
            <div class="col-lg-3">
              <select class="form-select" name="status">
                <option value="">ทุกสถานะ</option>
                <option
                  th:each="s:${statuses}"
                  th:value="${s}"
                  th:text="${statusLabels[s.name()]}"
                  th:selected="${s==selectedStatus}"
                ></option>
              </select>
            </div>
            <div class="col-lg-2 d-grid">
              <button class="btn btn-outline-primary">กรองข้อมูล</button>
            </div>
          </div>
        </form>
        <section class="card" data-ajax-table="jobs">
          <div class="table-responsive">
            <table class="table table-hover">
              <thead>
                <tr>
                  <th>เลขที่ใบงาน</th>
                  <th>ลูกค้า</th>
                  <th>หัวข้องาน</th>
                  <th>บริการ</th>
                  <th>หัวหน้าช่าง</th>
                  <th>วันนัดหมาย</th>
                  <th>สถานะ</th>
                  <th class="text-end">ยอดรวม</th>
                  <th>จัดการ</th>
                </tr>
              </thead>
              <tbody>
                <tr th:each="job:${jobs.content}">
                  <td>
                    <span
                      class="fw-bold"
                      th:text="${job.jobNo}"
                    ></span>
                  </td>
                  <td>
                    <strong th:text="${job.customer.displayName}"></strong
                    ><small
                      class="d-block text-muted"
                      th:text="${job.contactPhone}"
                    ></small>
                  </td>
                  <td th:text="${job.title}"></td>
                  <td th:text="${job.service.serviceName}"></td>
                  <td
                    th:text="${job.technician != null ? job.technician.fullName : '-'}"
                  ></td>
                  <td
                    th:text="${#temporals.format(job.appointmentStart,'dd/MM/yyyy HH:mm')}"
                  ></td>
                  <td>
                    <span
                      class="status-badge"
                      th:classappend="'status-'+${job.jobStatus}"
                      th:text="${statusLabels[job.jobStatus.name()]}"
                    ></span>
                  </td>
                  <td
                    class="text-end fw-semibold"
                    th:text="'฿'+${#numbers.formatDecimal(job.grandTotal,1,'COMMA',2,'POINT')}"
                  ></td>
                  <td>
                    <div class="d-flex flex-wrap gap-1">
                      <button type="button" class="btn btn-sm btn-outline-primary text-nowrap"
                        data-bs-toggle="modal" data-bs-target="#jobDetailsModal"
                        th:attr="data-job-details-url=@{/calendar/jobs/{id}/details(id=${job.id})}"><i class="bi bi-eye me-1"></i>ดูข้อมูล</button>
                      <a class="btn btn-sm btn-outline-danger text-nowrap" th:if="${job.jobStatus.name()!='COMPLETED' and job.jobStatus.name()!='CANCELLED'}" th:href="@{/jobs/{id}(id=${job.id})} + '#cancelModal'"><i class="bi bi-x-circle me-1"></i>ยกเลิกงาน</a>
                    </div>
                  </td>
                </tr>
                <tr th:if="${jobs.empty}">
                  <td colspan="9">
                    <div class="empty-state">
                      <i class="bi bi-inbox"></i>ไม่พบใบงาน
                    </div>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
          <div th:replace="~{fragments/layout :: pagination(page=${jobs}, baseUrl='/jobs', q=${q}, status=${selectedStatus})}"></div>
        </section>
      </main>
    </div>
    <div
      class="modal fade"
      id="createJobModal"
      data-reset-on-open
      tabindex="-1"
      aria-labelledby="createJobModalTitle"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-xl modal-dialog-scrollable modal-dialog-centered modal-fullscreen-lg-down">
        <div class="modal-content">
          <div class="modal-header">
            <h2 class="modal-title fs-5" id="createJobModalTitle">สร้างใบงานใหม่</h2>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="ปิด"
            ></button>
          </div>
          <div class="modal-body p-0">
            <div th:replace="~{job/form :: jobCreateForm}"></div>
          </div>
        </div>
      </div>
    </div>
    <div class="modal fade" id="jobDetailsModal" tabindex="-1" aria-labelledby="jobDetailsModalTitle" aria-hidden="true">
      <div class="modal-dialog modal-xl modal-dialog-scrollable modal-dialog-centered modal-fullscreen-lg-down">
        <div class="modal-content">
          <div class="modal-header">
            <h2 class="modal-title fs-5" id="jobDetailsModalTitle">รายละเอียดใบงาน</h2>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="ปิด"></button>
          </div>
          <div class="modal-body" id="jobDetailsModalBody" aria-live="polite">
            <div class="d-flex justify-content-center align-items-center gap-2 py-5 text-muted">
              <span class="spinner-border spinner-border-sm" aria-hidden="true"></span>กำลังโหลดรายละเอียดใบงาน...
            </div>
          </div>
          <div class="modal-footer"><button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">ปิด</button></div>
        </div>
      </div>
    </div>
    <div th:replace="~{fragments/layout :: scripts}"></div>
  </body>
</html>
