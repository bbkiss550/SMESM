<!doctype html>
<html lang="th" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/layout :: head('งานของฉัน')}"></head>
  <body>
    <header class="app-topbar" style="margin-left: 0">
      <a class="public-brand" th:href="@{/my-jobs}"
        ><span class="brand-mark text-white"
          ><i class="bi bi-briefcase-fill"></i></span
        ><span>SME Service Manager</span></a
      >
      <div class="topbar-actions">
        <button class="icon-btn" data-theme-toggle>
          <i class="bi bi-moon-stars"></i>
        </button>
        <form th:action="@{/logout}" method="post">
          <button class="icon-btn text-danger">
            <i class="bi bi-box-arrow-right"></i>
          </button>
        </form>
      </div>
    </header>
    <main class="container py-4" style="max-width: 760px">
      <div th:replace="~{fragments/layout :: flash}"></div>
      <div class="mb-4">
        <h1 class="page-title">งานของฉัน</h1>
        <p class="page-subtitle">งานที่ได้รับมอบหมาย</p>
      </div>
      <div class="d-flex gap-2 overflow-auto pb-3">
        <button class="btn btn-primary text-nowrap">
          ทั้งหมด
          <span
            class="badge text-bg-light ms-1"
            th:text="${#lists.size(jobs)}"
          ></span></button
        ><button class="btn btn-outline-primary text-nowrap">รอรับงาน</button
        ><button class="btn btn-outline-primary text-nowrap">
          กำลังดำเนินการ</button
        ><button class="btn btn-outline-primary text-nowrap">รออะไหล่</button>
      </div>
      <div class="d-grid gap-3">
        <a
          class="card card-body text-body"
          th:each="job:${jobs}"
          th:href="@{/my-jobs/{id}(id=${job.id})}"
          ><div class="d-flex justify-content-between gap-2">
            <strong class="text-primary" th:text="${job.jobNo}"></strong
            ><span
              class="status-badge"
              th:classappend="'status-'+${job.jobStatus}"
              th:text="${statusLabels[job.jobStatus.name()]}"
            ></span>
          </div>
          <h2
            class="h5 fw-bold my-2"
            th:text="${job.customer.displayName}"
          ></h2>
          <div class="text-muted" th:text="${job.title}"></div>
          <div class="row g-2 mt-2 small">
            <div class="col-sm-6">
              <i class="bi bi-calendar3 text-primary me-2"></i
              ><span
                th:text="${#temporals.format(job.appointmentStart,'dd/MM/yyyy HH:mm')}"
              ></span>
            </div>
            <div class="col-sm-6">
              <i class="bi bi-geo-alt text-primary me-2"></i
              ><span class="text-truncate" th:text="${job.address}"></span>
            </div></div
        ></a>
        <div class="empty-state card" th:if="${#lists.isEmpty(jobs)}">
          <i class="bi bi-clipboard-check"></i>ยังไม่มีงานที่ได้รับมอบหมาย
        </div>
      </div>
    </main>
    <div th:replace="~{fragments/layout :: scripts}"></div>
  </body>
</html>
