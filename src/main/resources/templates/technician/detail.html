<!doctype html>
<html lang="th" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/layout :: head('รายละเอียดงาน')}"></head>
  <body>
    <header class="app-topbar" style="margin-left: 0">
      <a th:href="@{/my-jobs}" class="icon-btn"
        ><i class="bi bi-arrow-left fs-5"></i></a
      ><strong>รายละเอียดงาน</strong>
      <div class="topbar-actions">
        <button class="icon-btn" data-theme-toggle>
          <i class="bi bi-moon-stars"></i>
        </button>
      </div>
    </header>
    <main class="container py-3" style="max-width: 760px">
      <div th:replace="~{fragments/layout :: flash}"></div>
      <section class="card mb-3">
        <div class="card-body">
          <div class="d-flex justify-content-between">
            <strong class="text-primary fs-5" th:text="${job.jobNo}"></strong
            ><span
              class="status-badge"
              th:classappend="'status-'+${job.jobStatus}"
              th:text="${statusLabels[job.jobStatus.name()]}"
            ></span>
          </div>
          <h1 class="h4 fw-bold mt-3" th:text="${job.title}"></h1>
          <div class="fs-5" th:text="${job.customer.displayName}"></div>
          <a
            th:href="'tel:'+${job.contactPhone}"
            th:text="${job.contactPhone}"
          ></a>
          <div class="p-3 bg-primary bg-opacity-10 rounded-3 mt-3">
            <div>
              <i class="bi bi-geo-alt-fill text-primary me-2"></i
              ><span th:text="${job.address}"></span>
            </div>
            <div class="mt-2">
              <i class="bi bi-calendar3 text-primary me-2"></i
              ><span
                th:text="${#temporals.format(job.appointmentStart,'dd/MM/yyyy HH:mm')+' - '+#temporals.format(job.appointmentEnd,'HH:mm')}"
              ></span>
            </div>
          </div>
          <h2 class="h6 fw-bold mt-4">รายละเอียดงาน</h2>
          <p th:text="${job.description}"></p>
        </div>
      </section>
      <div class="row g-2 mb-3">
        <div class="col-6" th:if="${job.jobStatus.name()=='ASSIGNED'}">
          <form th:action="@{/my-jobs/{id}/accept(id=${job.id})}" method="post">
            <button class="btn btn-primary w-100 py-3">
              <i class="bi bi-check-circle me-2"></i>รับงาน
            </button>
          </form>
        </div>
        <div class="col-6" th:if="${job.jobStatus.name()=='ASSIGNED'}">
          <form th:action="@{/my-jobs/{id}/status(id=${job.id})}" method="post">
            <input type="hidden" name="status" value="IN_PROGRESS" /><button
              class="btn btn-success w-100 py-3"
            >
              <i class="bi bi-play-fill me-2"></i>เริ่มงาน
            </button>
          </form>
        </div>
        <div class="col-6" th:if="${job.jobStatus.name()=='IN_PROGRESS'}">
          <button
            class="btn btn-primary w-100 py-3"
            data-bs-toggle="modal"
            data-bs-target="#photoModal"
          >
            <i class="bi bi-camera me-2"></i>เพิ่มรูป
          </button>
        </div>
        <div class="col-6" th:if="${job.jobStatus.name()=='IN_PROGRESS'}">
          <button
            class="btn btn-warning w-100 py-3"
            data-bs-toggle="modal"
            data-bs-target="#partModal"
          >
            <i class="bi bi-gear me-2"></i>เพิ่มอะไหล่
          </button>
        </div>
        <div class="col-6" th:if="${job.jobStatus.name()=='IN_PROGRESS'}">
          <form th:action="@{/my-jobs/{id}/status(id=${job.id})}" method="post">
            <input type="hidden" name="status" value="WAITING_PART" /><button
              class="btn btn-outline-warning w-100 py-3"
            >
              รออะไหล่
            </button>
          </form>
        </div>
        <div class="col-6" th:if="${job.jobStatus.name()=='WAITING_PART'}">
          <form th:action="@{/my-jobs/{id}/status(id=${job.id})}" method="post">
            <input type="hidden" name="status" value="IN_PROGRESS" /><button
              class="btn btn-primary w-100 py-3"
            >
              ดำเนินงานต่อ
            </button>
          </form>
        </div>
        <div class="col-12" th:if="${job.jobStatus.name()=='IN_PROGRESS'}">
          <form
            class="js-confirm"
            th:action="@{/my-jobs/{id}/status(id=${job.id})}"
            method="post"
            data-confirm-title="ยืนยันปิดงาน?"
          >
            <input type="hidden" name="status" value="COMPLETED" /><button
              class="btn btn-success w-100 py-3"
            >
              <i class="bi bi-flag-fill me-2"></i>ปิดงาน
            </button>
          </form>
        </div>
      </div>
      <section class="card">
        <div class="card-header"><h2 class="section-title">ประวัติงาน</h2></div>
        <div class="card-body">
          <div class="timeline">
            <div class="timeline-item" th:each="a:${job.activities}">
              <strong th:text="${a.description}"></strong>
              <div
                class="small text-muted"
                th:text="${#temporals.format(a.activityDate,'dd/MM/yyyy HH:mm')}"
              ></div>
            </div>
          </div>
        </div>
      </section>
    </main>
    <div class="modal fade" id="photoModal">
      <div class="modal-dialog">
        <form
          class="modal-content"
          th:action="@{/my-jobs/{id}/attachments(id=${job.id})}"
          method="post"
          enctype="multipart/form-data"
        >
          <div class="modal-header">
            <h5>เพิ่มรูปภาพ</h5>
            <button class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <select class="form-select mb-3" name="type">
              <option value="BEFORE">ก่อนดำเนินการ</option>
              <option value="DURING">ระหว่างดำเนินการ</option>
              <option value="AFTER">หลังดำเนินการ</option></select
            ><input
              class="form-control"
              type="file"
              accept="image/jpeg,image/png"
              name="file"
              required
            />
          </div>
          <div class="modal-footer">
            <button class="btn btn-primary">อัปโหลด</button>
          </div>
        </form>
      </div>
    </div>
    <div class="modal fade" id="partModal">
      <div class="modal-dialog">
        <form
          class="modal-content"
          th:action="@{/my-jobs/{id}/items(id=${job.id})}"
          th:object="${itemForm}"
          method="post"
        >
          <input type="hidden" th:field="*{itemType}" value="PRODUCT" />
          <div class="modal-header">
            <h5>เพิ่มอะไหล่</h5>
            <button class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <select
              class="form-select mb-3"
              th:field="*{productId}"
              data-product-select
              data-searchable-select
              data-search-placeholder="ค้นหาสินค้าหรืออะไหล่..."
              data-price-target="#mobilePrice"
              data-unit-target="#mobileUnit"
            >
              <option value="">เลือกอะไหล่</option>
              <option
                th:each="p:${products}"
                th:value="${p.id}"
                th:text="${p.productName+' · คงเหลือ '+p.stockQty}"
                th:data-price="${p.salePrice}"
                th:data-unit="${p.unit}"
              ></option>
            </select>
            <div class="row g-2">
              <div class="col-4">
                <input
                  class="form-control"
                  type="number"
                  step="0.01"
                  th:field="*{quantity}"
                  placeholder="จำนวน"
                />
              </div>
              <div class="col-4">
                <input
                  id="mobileUnit"
                  class="form-control"
                  th:field="*{unit}"
                />
              </div>
              <div class="col-4">
                <input
                  id="mobilePrice"
                  class="form-control"
                  type="number"
                  step="0.01"
                  th:field="*{unitPrice}"
                />
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button class="btn btn-primary">เพิ่มอะไหล่</button>
          </div>
        </form>
      </div>
    </div>
    <div th:replace="~{fragments/layout :: scripts}"></div>
  </body>
</html>
