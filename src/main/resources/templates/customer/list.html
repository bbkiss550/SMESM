<!doctype html>
<html lang="th" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/layout :: head('ลูกค้า')}"></head>
  <body>
    <aside th:replace="~{fragments/layout :: sidebar('customers')}"></aside>
    <div th:replace="~{fragments/layout :: overlay}"></div>
    <div class="app-shell">
      <header th:replace="~{fragments/layout :: topbar}"></header>
      <main class="app-content">
        <div th:replace="~{fragments/layout :: flash}"></div>
        <div class="page-header">
          <div>
            <h1 class="page-title">ลูกค้า</h1>
            <p class="page-subtitle">จัดการรายชื่อลูกค้าทั้งหมดในระบบ</p>
          </div>
          <button
            class="btn btn-primary"
            data-bs-toggle="modal"
            data-bs-target="#customerModal"
          >
            <i class="bi bi-plus-lg me-2"></i>เพิ่มลูกค้า
          </button>
        </div>
        <form class="card filter-bar" data-ajax-search="customers">
          <div class="input-group">
            <span class="input-group-text bg-transparent"
              ><i class="bi bi-search"></i></span
            ><input
              class="form-control"
              name="q"
              th:value="${q}"
              placeholder="ค้นหาชื่อบริษัท ชื่อผู้ติดต่อ เบอร์โทร หรือไลน์"
            /><button class="btn btn-outline-primary">ค้นหา</button>
          </div>
        </form>
        <section class="card" data-ajax-table="customers">
          <div class="table-responsive">
            <table class="table table-hover">
              <thead>
                <tr>
                  <th>รหัสลูกค้า</th>
                  <th>ชื่อ</th>
                  <th>บริษัท</th>
                  <th>เบอร์โทร</th>
                  <th>ไลน์</th>
                  <th>ประเภท</th>
                  <th>สถานะ</th>
                  <th>จัดการ</th>
                </tr>
              </thead>
              <tbody>
                <tr th:each="c:${customers.content}">
                  <td>
                    <span class="fw-bold" th:text="${c.customerCode}"></span>
                  </td>
                  <td th:text="${c.name}"></td>
                  <td th:text="${c.companyName ?: '-'}"></td>
                  <td th:text="${c.primaryPhone}"></td>
                  <td th:text="${c.lineId ?: '-'}"></td>
                  <td
                    th:text="${c.customerType.name()=='BUSINESS'?'นิติบุคคล':'บุคคลทั่วไป'}"
                  ></td>
                  <td>
                    <span
                      class="status-badge"
                      th:classappend="'status-'+${c.status}"
                      th:text="${statusLabels[c.status]}"
                    ></span>
                  </td>
                  <td>
                    <div class="d-flex flex-wrap gap-1">
                      <button type="button" class="btn btn-sm btn-outline-primary" data-bs-toggle="modal" data-bs-target="#customerViewModal" data-view-kind="customer"
                        th:attr="data-customer-details-url=@{/customers/{id}/details(id=${c.id})}">
                        <i class="bi bi-eye me-1"></i>ดูข้อมูล
                      </button>
                      <button type="button" class="btn btn-sm btn-outline-secondary" data-bs-toggle="modal" data-bs-target="#customerModal" data-edit-kind="customer"
                        th:attr="data-id=${c.id},data-customer-type=${c.customerType},data-name=${c.name},data-company-name=${c.companyName},data-tax-id=${c.taxId},data-primary-phone=${c.primaryPhone == '-' ? '' : c.primaryPhone},data-secondary-phone=${c.secondaryPhone},data-email=${c.email},data-line-id=${c.lineId},data-address=${c.address},data-note=${c.note}">
                        <i class="bi bi-pencil me-1"></i>แก้ไข
                      </button>
                      <form class="js-confirm" th:action="@{/customers/{id}/toggle(id=${c.id})}" method="post" th:attr="data-confirm-title=${c.active?'ลบลูกค้านี้?':'เปิดใช้งานลูกค้านี้?'},data-confirm-text=${c.active?'ระบบจะปิดใช้งานและเก็บประวัติลูกค้าไว้':'ลูกค้าจะกลับมาใช้งานได้'}">
                        <button class="btn btn-sm btn-outline-danger" th:text="${c.active?'ลบ':'เปิดใช้งาน'}"></button>
                      </form>
                    </div>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
          <div th:replace="~{fragments/layout :: pagination(page=${customers}, baseUrl='/customers', q=${q}, status=null)}"></div>
        </section>
      </main>
    </div>
    <div class="modal fade" id="customerModal" data-reset-on-open data-create-action="/customers" data-create-title="เพิ่มลูกค้า" data-create-submit="บันทึกลูกค้า">
      <div class="modal-dialog modal-lg">
        <form
          class="modal-content"
          th:action="@{/customers}"
          th:object="${customerForm}"
          method="post"
        >
          <div class="modal-header">
            <h5 class="modal-title" data-form-title>เพิ่มลูกค้า</h5>
            <button class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <div class="row g-3">
              <div class="col-md-4">
                <label class="form-label">ประเภทลูกค้า</label
                ><select class="form-select" th:field="*{customerType}">
                  <option value="INDIVIDUAL">บุคคลทั่วไป</option>
                  <option value="BUSINESS">นิติบุคคล</option>
                </select>
              </div>
              <div class="col-md-8">
                <label class="form-label required">ชื่อผู้ติดต่อ</label
                ><input class="form-control" th:field="*{name}" required />
              </div>
              <div class="col-md-8">
                <label class="form-label">ชื่อบริษัท</label
                ><input class="form-control" th:field="*{companyName}" />
              </div>
              <div class="col-md-4">
                <label class="form-label">เลขผู้เสียภาษี</label
                ><input class="form-control" th:field="*{taxId}" />
              </div>
              <div class="col-md-6">
                <label class="form-label required">เบอร์หลัก</label
                ><input
                  class="form-control"
                  th:field="*{primaryPhone}"
                  maxlength="10"
                  inputmode="numeric"
                  data-phone-counter
                  required
                />
              </div>
              <div class="col-md-6">
                <label class="form-label">เบอร์สำรอง</label
                ><input class="form-control" th:field="*{secondaryPhone}" maxlength="10" inputmode="numeric" data-phone-counter />
              </div>
              <div class="col-md-6">
                <label class="form-label">อีเมล</label
                ><input class="form-control" type="email" th:field="*{email}" />
              </div>
              <div class="col-md-6">
                <label class="form-label">ไอดีไลน์</label
                ><input class="form-control" th:field="*{lineId}" />
              </div>
              <div class="col-12">
                <label class="form-label">ที่อยู่</label
                ><textarea
                  class="form-control"
                  rows="3"
                  th:field="*{address}"
                ></textarea>
              </div>
              <div class="col-12">
                <label class="form-label">หมายเหตุ</label
                ><textarea class="form-control" th:field="*{note}"></textarea>
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button class="btn btn-primary" data-form-submit>บันทึกลูกค้า</button>
          </div>
        </form>
      </div>
    </div>
    <div class="modal fade" id="customerViewModal" tabindex="-1" aria-labelledby="customerViewModalTitle" aria-hidden="true">
      <div class="modal-dialog modal-xl modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content">
          <div class="modal-header">
            <div><h2 class="modal-title fs-5" id="customerViewModalTitle">รายละเอียดลูกค้า</h2><small class="text-muted" data-customer-view="code"></small></div>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="ปิด"></button>
          </div>
          <div class="modal-body" id="customerViewModalBody" aria-live="polite"><div class="d-flex justify-content-center align-items-center gap-2 py-5 text-muted"><span class="spinner-border spinner-border-sm" aria-hidden="true"></span>กำลังโหลดข้อมูลลูกค้า...</div></div>
        </div>
      </div>
    </div>
    <div th:replace="~{fragments/layout :: scripts}"></div>
  </body>
</html>
