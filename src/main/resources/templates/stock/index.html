<!doctype html>
<html lang="th" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/layout :: head('สต๊อก')}"></head>
  <body>
    <aside th:replace="~{fragments/layout :: sidebar('stock')}"></aside>
    <div th:replace="~{fragments/layout :: overlay}"></div>
    <div class="app-shell">
      <header th:replace="~{fragments/layout :: topbar}"></header>
      <main class="app-content">
        <div th:replace="~{fragments/layout :: flash}"></div>
        <div class="page-header">
          <div>
            <h1 class="page-title">สต๊อก</h1>
            <p class="page-subtitle">
              ติดตามความเคลื่อนไหวสต๊อก เข้า–ออก–ปรับปรุง
            </p>
          </div>
          <button
            class="btn btn-primary"
            data-bs-toggle="modal"
            data-bs-target="#stockModal"
          >
            <i class="bi bi-plus-lg me-2"></i>บันทึกรายการสต๊อก
          </button>
        </div>
        <section class="kpi-grid" style="grid-template-columns: repeat(3, 1fr)">
          <article class="card kpi-card">
            <span class="kpi-icon"><i class="bi bi-box"></i></span>
            <div>
              <div class="kpi-label">สินค้าทั้งหมด</div>
              <div class="kpi-value" th:text="${#lists.size(products)}"></div>
            </div>
          </article>
          <article class="card kpi-card">
            <span class="kpi-icon"
              ><i class="bi bi-exclamation-triangle"></i
            ></span>
            <div>
              <div class="kpi-label">สินค้าใกล้หมด</div>
              <div
                class="kpi-value"
                th:text="${#lists.size(products.?[stockLevel == 'LOW_STOCK'])}"
              ></div>
            </div>
          </article>
          <article class="card kpi-card">
            <span class="kpi-icon"><i class="bi bi-x-octagon"></i></span>
            <div>
              <div class="kpi-label">สินค้าหมดสต๊อก</div>
              <div
                class="kpi-value"
                th:text="${#lists.size(products.?[stockLevel == 'OUT_OF_STOCK'])}"
              ></div>
            </div>
          </article>
        </section>
        <section class="card">
          <div class="table-responsive">
            <table class="table table-hover">
              <thead>
                <tr>
                  <th>วันที่ / เวลา</th>
                  <th>ประเภท</th>
                  <th>รหัสสินค้า</th>
                  <th>ชื่อสินค้า</th>
                  <th>เลขอ้างอิง</th>
                  <th class="text-end">จำนวน</th>
                  <th class="text-end">ก่อน</th>
                  <th class="text-end">หลัง</th>
                  <th>ผู้ทำรายการ</th>
                </tr>
              </thead>
              <tbody>
                <tr th:each="tx:${transactions.content}">
                  <td
                    th:text="${#temporals.format(tx.createDate,'dd/MM/yyyy HH:mm')}"
                  ></td>
                  <td>
                    <span
                      class="status-badge"
                      th:classappend="${tx.transactionType.name()=='OUT'?'status-CANCELLED':'status-COMPLETED'}"
                      th:text="${enumLabels[tx.transactionType.name()]}"
                    ></span>
                  </td>
                  <td th:text="${tx.product.productCode}"></td>
                  <td th:text="${tx.product.productName}"></td>
                  <td th:text="${tx.reference ?: '-'}"></td>
                  <td class="text-end fw-bold" th:text="${tx.quantity}"></td>
                  <td class="text-end" th:text="${tx.quantityBefore}"></td>
                  <td class="text-end" th:text="${tx.quantityAfter}"></td>
                  <td th:text="${tx.createBy}"></td>
                </tr>
              </tbody>
            </table>
          </div>
        </section>
      </main>
    </div>
    <div class="modal fade" id="stockModal">
      <div class="modal-dialog">
        <form class="modal-content" th:action="@{/stock/adjust}" method="post">
          <div class="modal-header">
            <h5 class="modal-title">บันทึกรายการสต๊อก</h5>
            <button class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <label class="form-label">สินค้า</label
            ><select
              class="form-select mb-3"
              name="productId"
              data-searchable-select
              data-search-placeholder="ค้นหาสินค้าหรืออะไหล่..."
              required
            >
              <option value="">เลือกสินค้า</option>
              <option
                th:each="p:${products}"
                th:value="${p.id}"
                th:text="${p.productCode+' · '+p.productName+' (คงเหลือ '+p.stockQty+')'}"
              ></option></select
            ><label class="form-label">ประเภทรายการ</label
            ><select class="form-select mb-3" name="type">
              <option value="IN">รับเข้า</option>
              <option value="OUT">เบิกออก</option>
              <option value="ADJUST">ปรับยอดคงเหลือ</option></select
            ><label class="form-label">จำนวน</label
            ><input
              class="form-control mb-3"
              type="number"
              step="0.01"
              name="quantity"
              required
            /><label class="form-label">เลขอ้างอิง</label
            ><input class="form-control mb-3" name="reference" /><label
              class="form-label"
              >หมายเหตุ</label
            ><textarea class="form-control" name="note"></textarea>
          </div>
          <div class="modal-footer">
            <button class="btn btn-primary">บันทึก</button>
          </div>
        </form>
      </div>
    </div>
    <div th:replace="~{fragments/layout :: scripts}"></div>
  </body>
</html>
