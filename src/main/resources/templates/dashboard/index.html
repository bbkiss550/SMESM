<!doctype html>
<html lang="th" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/layout :: head('แดชบอร์ด')}"></head>
  <body>
    <aside th:replace="~{fragments/layout :: sidebar('dashboard')}"></aside>
    <div th:replace="~{fragments/layout :: overlay}"></div>
    <div class="app-shell">
      <header th:replace="~{fragments/layout :: topbar}"></header>
      <main class="app-content dashboard-overview" data-dashboard-overview>
        <div th:replace="~{fragments/layout :: flash}"></div>
        <div class="page-header dashboard-overview-header">
          <div class="d-flex flex-wrap align-items-center gap-3">
            <h1 class="page-title mb-0">แดชบอร์ด</h1>
            <span class="dashboard-today"><i class="bi bi-calendar3 me-2"></i><span th:text="${overview.todayLabel}"></span></span>
          </div>
          <div class="dashboard-period-controls">
            <select class="form-select" data-overview-period aria-label="ช่วงเวลาสรุป">
              <option value="DAILY">รายวัน</option><option value="MONTHLY">รายเดือน</option><option value="YEARLY">รายปี</option>
            </select>
            <button class="btn btn-outline-primary" type="button" data-overview-step="-1" aria-label="ช่วงก่อนหน้า"><i class="bi bi-chevron-left"></i></button>
            <input class="form-control" type="text" data-overview-date th:value="${overview.date}" aria-label="วันที่อ้างอิง" />
            <button class="btn btn-outline-primary" type="button" data-overview-step="1" aria-label="ช่วงถัดไป"><i class="bi bi-chevron-right"></i></button>
          </div>
        </div>
        <div class="dashboard-period-caption" data-overview-caption th:text="${overview.label}"></div>
        <div data-overview-content aria-live="polite"></div>
        <noscript><div class="alert alert-warning">กรุณาเปิดใช้งาน JavaScript เพื่อแสดงแดชบอร์ด</div></noscript>
      </main>
    </div>
    <div th:replace="~{fragments/layout :: scripts}"></div>
    <script th:inline="javascript">window.dashboardInitialOverview = [[${overview}]];</script>
    <script th:src="@{/assets/js/dashboard-overview.js(v='20261002-2')}"></script>
  </body>
</html>
