<!doctype html>
<html lang="th" xmlns:th="http://www.thymeleaf.org">
<section th:fragment="detail" class="service-report">
  <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-4">
    <div><h2 class="fs-4 fw-bold"><i class="bi bi-file-earmark-bar-graph text-primary me-2"></i><span th:text="'รายงาน' + ${definition.title}"></span></h2>
      <p class="text-muted mb-0" th:text="${definition.description}"></p></div>
    <button type="button" class="btn btn-outline-secondary" data-report-back><i class="bi bi-arrow-left me-2"></i>กลับหน้ารวมรายงาน</button>
  </div>
  <form class="card p-3 mb-3" data-service-report-form>
    <div class="row g-3">
      <div class="col-md-4"><label class="form-label" for="report-basis" th:text="${definition.dateLabel}"></label><div id="report-basis" class="form-control bg-light" th:text="${definition.dateLabel}"></div></div>
      <div class="col-md-4"><label class="form-label" for="report-start">วันที่เริ่มต้น</label><input id="report-start" type="date" class="form-control" name="start" th:value="${start}" required></div>
      <div class="col-md-4"><label class="form-label" for="report-end">วันที่สิ้นสุด</label><input id="report-end" type="date" class="form-control" name="end" th:value="${end}" required></div>
    </div>
    <div class="d-flex flex-wrap gap-2 mt-3"><button class="btn btn-primary" type="submit"><i class="bi bi-search me-2"></i>แสดงรายงาน</button><button class="btn btn-outline-secondary" type="button" data-report-reset>ล้างตัวกรอง</button><button class="btn btn-outline-primary" type="button" data-service-pdf><i class="bi bi-file-earmark-pdf me-2"></i>ดูหน้ากระดาษรายงาน</button></div>
    <small class="text-muted mt-3" th:text="${definition.note}"></small>
  </form>
  <div th:if="${reportError != null}" class="alert alert-warning" role="alert" th:text="${reportError}"></div>
  <div th:if="${result != null}">
    <div class="service-report-summary mb-3">
      <div th:each="metric : ${result.metrics}" class="card p-3"><span class="text-muted" th:text="${metric.label}"></span><strong class="fs-4" th:text="${metric.value}"></strong></div>
    </div>
    <section class="card">
      <div class="p-3 border-bottom d-flex justify-content-between flex-wrap gap-2"><strong th:text="'รายการ' + ${definition.title}"></strong><span class="text-muted" th:text="'พบ ' + ${result.total} + ' รายการ'"></span></div>
      <div class="table-responsive"><table class="table table-hover mb-0">
        <thead><tr><th th:each="column : ${definition.columns}" th:text="${column}"></th></tr></thead>
        <tbody><tr th:each="row : ${result.rows}"><td th:each="cell : ${row.cells}" th:text="${cell}"></td></tr>
          <tr th:if="${result.total == 0}"><td colspan="6"><div class="empty-state"><i class="bi bi-inbox"></i>ไม่พบข้อมูลตามเงื่อนไขที่เลือก</div></td></tr>
        </tbody>
      </table></div>
      <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 p-3">
        <span class="text-muted" th:text="'หน้า ' + ${result.page + 1} + ' จาก ' + ${result.pages} + ' • หน้าละ 10 รายการ'"></span>
        <div class="d-flex gap-2"><button class="btn btn-sm btn-outline-primary" type="button" th:disabled="${result.page == 0}" th:attr="data-service-page=${result.page - 1}">ก่อนหน้า</button><button class="btn btn-sm btn-outline-primary" type="button" th:disabled="${result.page + 1 >= result.pages}" th:attr="data-service-page=${result.page + 1}">ถัดไป</button></div>
      </div>
    </section>
  </div>
</section>
</html>
