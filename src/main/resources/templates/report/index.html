<!doctype html>
<html lang="th" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/layout :: head('รายงาน')}"></head>
  <body>
    <aside th:replace="~{fragments/layout :: sidebar('reports')}"></aside>
    <div th:replace="~{fragments/layout :: overlay}"></div>
    <div class="app-shell">
      <header th:replace="~{fragments/layout :: topbar}"></header>
      <main class="app-content report-hub">
        <div class="report-hub-heading">
          <h1 class="page-title">รายงาน</h1>
          <p><i class="bi bi-bar-chart-line-fill" aria-hidden="true"></i> เลือกประเภทรายงานที่ต้องการดูข้อมูล</p>
        </div>
        <div class="report-groups">
          <section th:each="group : ${reportGroups}" class="report-group"
                   th:classappend="'report-group--' + ${group.key}"
                   th:attr="aria-labelledby='report-group-' + ${group.key}">
            <div class="report-group-heading">
              <i class="bi" th:classappend="'bi-' + ${group.icon}" aria-hidden="true"></i>
              <div><h2 th:id="'report-group-' + ${group.key}" th:text="${group.title}"></h2><p th:text="${group.description}"></p></div>
            </div>
            <div class="report-cards">
              <button th:each="report : ${group.reports}" type="button" class="report-card"
                      th:attr="data-report-code=${report.code},data-report-title=${report.title}"
                      aria-pressed="false" aria-controls="report-content">
                <span class="report-card-icon"><i class="bi" th:classappend="'bi-' + ${report.icon}" aria-hidden="true"></i></span>
                <span class="report-card-copy">
                  <span class="report-card-title" th:text="${report.number} + '. ' + ${report.title}"></span>
                  <span class="report-card-description" th:text="${report.description}"></span>
                </span>
                <i class="bi bi-chevron-right report-card-arrow" aria-hidden="true"></i>
                <span class="report-card-art" aria-hidden="true"><span class="report-art-lines"><span></span><span></span><span></span></span><i class="bi" th:classappend="'bi-' + ${report.icon}"></i></span>
              </button>
            </div>
          </section>
        </div>
        <!-- Reserved for future report detail rendering without changing the browser URL. -->
        <section id="report-content" class="report-content" aria-live="polite" hidden>
          <i class="bi bi-info-circle" aria-hidden="true"></i>
          <div><h2 data-report-content-title></h2><p>ส่วนรายละเอียดรายงานยังไม่เปิดใช้งาน</p></div>
        </section>
      </main>
    </div>
    <div th:replace="~{fragments/layout :: scripts}"></div>
    <script th:src="@{/assets/js/report-hub.js(v='20261002-1')}"></script>
  </body>
</html>
